<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Estoque</title>
  <link rel="stylesheet" href="/admin-static/admin.css">
</head>
<body>
  <div class="login-wrap">
    <div class="card">
      <h1>Estoque</h1>
      <p class="sub">Administração da loja</p>

      {% if erro %}<div class="aviso erro">{{ erro }}</div>{% endif %}

      <form method="post" action="/admin/login">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <div class="campo">
          <label for="loja_slug">Loja (slug)</label>
          <input id="loja_slug" name="loja_slug" autocomplete="off" required autofocus>
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn" type="submit" style="width:100%">Entrar</button>
      </form>
    </div>
  </div>
</body>
</html>
