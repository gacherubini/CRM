# LEGADO. Nao fazer `fly deploy` daqui.
# Apps monolíticos (estoque2037 etc.) foram destruídos. Deploy atual: deploy/fly/3vm/
app = "estoque2037"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "alembic upgrade head"

[env]
  ESTOQUE_SKIP_INIT = "1"
  ESTOQUE_PUBLIC_RATE_LIMIT = "120"
  ESTOQUE_OUTBOX_INTERVALO = "5"
  ESTOQUE_SESSION_SECURE_COOKIE = "1"
  ESTOQUE_MEDIA_STORAGE_DIR = "/data/media"
  ESTOQUE_MEDIA_PUBLIC_BASE_URL = "https://estoque2037.fly.dev/public/v1/media"
  ESTOQUE_MEDIA_ALLOWED_HOSTS = "estoque2037.fly.dev"
  ESTOQUE_MEDIA_ORPHAN_GRACE_SECONDS = "3600"
  ESTOQUE_MEDIA_CLEANUP_INTERVAL_SECONDS = "21600"

[processes]
  app = "/srv/scripts/fly-entrypoint.sh"

# Always-on: Portal/Catálogo/Chatbot dependem do Estoque sem cold-start (opção A).
[[services]]
  processes = ["app"]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    path = "/health/ready"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  processes = ["app"]
  size = "shared-cpu-1x"
  memory = "512"

[[mounts]]
  source = "estoque_media"
  destination = "/data"
