app = "motor2037"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Executa a migração uma única vez por deploy, antes de iniciar API e worker.
  release_command = "alembic upgrade head"

[env]
  MOTOR_ENV = "production"
  MOTOR_SKIP_INIT = "1"
  MOTOR_WORKER_INTERVALO = "2"
  MOTOR_JOB_LEASE_SECONDS = "180"
  MOTOR_BROWSER_HEADLESS = "0"
  MOTOR_BROWSER_TIMEOUT_MS = "60000"
  PLAYWRIGHT_CHROMIUM_USE_HEADLESS_SHELL = "0"
  MOTOR_SCREENSHOT_DIR = "/srv/data/screenshots"
  MOTOR_STORAGE_STATE_DIR = "/srv/data/storage_state"
  DISPLAY = ":99"

[processes]
  app = "/srv/scripts/fly-entrypoint.sh"

# API e worker compartilham uma única Machine.
# Always-on: Portal/Catálogo/n8n precisam do Motor sem cold-start (opção A lab/ops).
[[services]]
  processes = ["app"]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8000
    handlers = ["http"]

  [[services.http_checks]]
    path = "/health/ready"
    interval = "15s"
    timeout = "3s"

[[vm]]
  processes = ["app"]
  size = "shared-cpu-2x"
  # Lab always-on: 512MB (API+worker idle). Para RPA Santander (Chromium) subir para 2048:
  #   fly machine update <id> -a motor2037 --vm-memory 2048
  # e liberar RAM (parar Portal/Catálogo se der mem_overcommit).
  memory = "512"

# Sessões autenticadas e screenshots do navegador.
[[mounts]]
  source = "motor_data"
  destination = "/srv/data"
  processes = ["app"]
