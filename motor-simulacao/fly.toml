# LEGADO como orquestrador HTTP. O app motor2037 ainda existe, mas o deploy
# vigente é deploy/fly/3vm/fly.worker.toml (slots Playwright, sem API always-on).
# Nao fazer `fly deploy` daqui sem pedido explícito — recolocaria o monólito.
app = "motor2037"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Executa a migração uma única vez por deploy, antes de iniciar API e worker.
  release_command = "alembic upgrade head"

[env]
  MOTOR_ENV = "production"
  MOTOR_SKIP_INIT = "1"
  MOTOR_WORKER_INTERVALO = "2"
  # Lease maior que o deadline do driver evita outro worker reprocessar um job vivo.
  # Deadlines folgados: portais lentos + Chromium headed no Fly estouravam 240s.
  MOTOR_JOB_LEASE_SECONDS = "480"
  MOTOR_TASK_LEASE_SECONDS = "480"
  MOTOR_DRIVER_TIMEOUT_SECONDS = "420"
  MOTOR_EVENT_SCREENSHOTS = "1"
  MOTOR_SCREENSHOT_RETENTION_DAYS = "7"
  MOTOR_BROWSER_HEADLESS = "0"
  MOTOR_BROWSER_TIMEOUT_MS = "90000"
  PLAYWRIGHT_CHROMIUM_USE_HEADLESS_SHELL = "0"
  MOTOR_SCREENSHOT_DIR = "/srv/data/screenshots"
  MOTOR_STORAGE_STATE_DIR = "/srv/data/storage_state"
  DISPLAY = ":99"
  # Always-on = orquestrador leve (API + mock/api). Playwright = slots 2GB sob demanda.
  MOTOR_ORCHESTRATOR_ONLY = "1"
  MOTOR_WORKER_TIPOS = "api,mock"
  # Secrets: MOTOR_FANOUT_ENABLED, MOTOR_FLY_AUTOSCALE_ENABLED, FLY_API_TOKEN, etc.

[processes]
  app = "/srv/scripts/fly-entrypoint.sh"
  # Slots Playwright: Machines à parte, on-demand-worker-entrypoint.sh, restart on-failure.

# API + worker leve always-on. Playwright: machines extras, exit 0 → stopped.
[[services]]
  processes = ["app"]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8000
    handlers = ["http"]

  [[services.http_checks]]
    path = "/health/ready"
    interval = "15s"
    timeout = "3s"

[[vm]]
  processes = ["app"]
  size = "shared-cpu-1x"
  # Orquestrador sem Chromium.
  memory = "512"

# Sessões autenticadas e screenshots do navegador.
[[mounts]]
  source = "motor_data"
  destination = "/srv/data"
  processes = ["app"]
