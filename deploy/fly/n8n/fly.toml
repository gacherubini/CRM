app = "n8n2037"
primary_region = "gru"

[build]
  image = "n8nio/n8n:2.26.8"

[env]
  N8N_HOST = "n8n2037.fly.dev"
  N8N_PROTOCOL = "https"
  N8N_PORT = "5678"
  N8N_EDITOR_BASE_URL = "https://n8n2037.fly.dev"
  N8N_SECURE_COOKIE = "true"
  WEBHOOK_URL = "https://n8n2037.fly.dev/"
  GENERIC_TIMEZONE = "America/Sao_Paulo"
  TZ = "America/Sao_Paulo"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS = "true"
  N8N_RUNNERS_ENABLED = "true"
  N8N_DIAGNOSTICS_ENABLED = "false"
  N8N_PERSONALIZATION_ENABLED = "false"

[http_service]
  internal_port = 5678
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024"

[[mounts]]
  source = "n8n_data"
  destination = "/home/node/.n8n"
