app = "app2037"
primary_region = "iad"

[build]
  # Deploy da raiz do repo (context = .):
  # fly deploy . -a app2037 -c deploy/fly/3vm/fly.app.toml --ha=false
  # dockerfile + ignorefile: relativos a ESTE fly.toml (deploy/fly/3vm/).
  # Sem ignorefile, flyctl usa só o .dockerignore do working directory (raiz).
  dockerfile = "Dockerfile.app"
  ignorefile = ".dockerignore"

[env]
  PORTAL_ENV = "production"
  PORTAL_SECURE_COOKIE = "1"
  PORTAL_TIMEZONE = "America/Sao_Paulo"
  PORTAL_DATABASE_URL = "sqlite:////data/portal/portal.db"
  CATALOGO_DATABASE_PATH = "/data/catalogo/catalogo.db"
  CATALOGO_SECURE_COOKIE = "1"
  CATALOGO_PUBLIC_BASE_URL = "https://app2037.fly.dev/catalogo"
  CATALOGO_URL_PREFIX = "/catalogo"
  CATALOGO_DEFAULT_STORE_SLUG = "moto-center"
  CATALOGO_EVENTS_URL = "http://127.0.0.1:8001/v1/integracoes/catalogo/interesses"
  # Slug único da loja: moto-center (o mesmo em Estoque, Chatbot e Catálogo).
  # O shim CATALOGO_PORTAL_STORE_SLUG="loja1" foi removido — com ele a vitrine
  # buscava o Pixel no Revy Tráfego sob "loja1" ignorando o próprio slug, então
  # Pixel configurado em moto-center nunca era encontrado (silenciosamente).
  # NÃO confundir com a instância da Evolution, que continua se chamando loja1.
  # Catálogo puxa Pixel ID (dono/equipe configura no Revy Tráfego; sem secret Fly).
  PORTAL_PUBLIC_URL = "http://127.0.0.1:9000"
  # Revy Tráfego no bundle (banco próprio, porta 9010, UI em /trafego)
  REVY_TRAFEGO_DATABASE_URL = "sqlite:////data/revy-trafego/revy_trafego.db"
  REVY_TRAFEGO_URL = "http://127.0.0.1:9010"
  REVY_TRAFEGO_PUBLIC_URL = "http://127.0.0.1:9010"
  REVY_TRAFEGO_URL_PREFIX = "/trafego"
  REVY_TRAFEGO_SECURE_COOKIE = "1"
  # Dropdown de lojas mesmo sem campanha/pixel no DB
  REVY_TRAFEGO_LOJAS = "moto-center"
  # Cutover completo (B1–B5): API + workers CAPI/spend só no Revy Tráfego.
  PORTAL_REVY_TRAFEGO_RESULTADOS = "1"
  PORTAL_REVY_TRAFEGO_VENDA_EVENTS = "1"
  PORTAL_TRAFEGO_UI_LEGACY = "0"
  # Portal NÃO processa CAPI/spend; publica vendas pelo outbox Portal -> Revy.
  PORTAL_CAPI_RETRY_ENABLED = "0"
  PORTAL_META_SPEND_SYNC_ENABLED = "0"
  # Revy Tráfego assume workers (força PORTAL_*=1 só no processo :9010).
  REVY_TRAFEGO_CAPI_WORKER = "1"
  REVY_TRAFEGO_META_SPEND_SYNC_ENABLED = "1"
  GOOGLE_ADS_SYNC_ENABLED = "0"
  GOOGLE_CONVERSIONS_ENABLED = "0"
  MULTI_WHATSAPP_ENABLED = "0"
  REVY_CONTROL_DASHBOARD_ENABLED = "0"
  SIMULATION_PROVIDER = "http"
  MOTOR_URL = "http://127.0.0.1:8004"
  ESTOQUE_API_URL = "http://127.0.0.1:8002"
  ESTOQUE_PUBLIC_URL = "http://127.0.0.1:8002"
  ESTOQUE_PUBLIC_API_URL = "http://127.0.0.1:8002"
  CHATBOT_API_URL = "http://127.0.0.1:8001"
  CHATBOT_AUDIO_EVOLUTION_URL = "https://evolution2037.fly.dev"
  CHATBOT_IMAGE_EVOLUTION_URL = "https://evolution2037.fly.dev"
  CHATBOT_SKIP_INIT = "1"
  ESTOQUE_SKIP_INIT = "1"
  ESTOQUE_SESSION_SECURE_COOKIE = "1"
  ESTOQUE_MEDIA_STORAGE_DIR = "/data/estoque/media"
  # Ajustar host público do app se mídia for servida via cert no app2037
  ESTOQUE_MEDIA_PUBLIC_BASE_URL = "https://app2037.fly.dev/public/v1/media"
  ESTOQUE_MEDIA_ALLOWED_HOSTS = "app2037.fly.dev"
  MOTOR_ENV = "production"
  MOTOR_SKIP_INIT = "1"
  MOTOR_ORCHESTRATOR_ONLY = "1"
  MOTOR_WORKER_TIPOS = "api,mock"
  # Fan-out + autoscale: a API cria tarefas por banco e acorda os workers
  # Playwright do motor2037. Sem estas, o bundle roda os drivers inline em iad
  # (sem browser) e o motor nunca acorda. O worker (fly.worker.toml) ja tem =1.
  MOTOR_FANOUT_ENABLED = "1"
  MOTOR_FLY_AUTOSCALE_ENABLED = "1"
  # Alvo do wake = app dos workers Playwright. NAO usar FLY_APP_NAME (reservada
  # do Fly = app2037), senao o start bate em /apps/app2037 e da 404.
  MOTOR_FLY_APP_NAME = "motor2037"
  N8N_HOST = "n8n2037.fly.dev"
  N8N_PROTOCOL = "https"
  N8N_PORT = "5678"
  N8N_EDITOR_BASE_URL = "https://n8n2037.fly.dev"
  N8N_SECURE_COOKIE = "true"
  WEBHOOK_URL = "https://n8n2037.fly.dev/"
  GENERIC_TIMEZONE = "America/Sao_Paulo"
  TZ = "America/Sao_Paulo"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS = "true"
  PORTAL_HOST = "portal2037.fly.dev"
  CATALOGO_HOST = "catalogo2037.fly.dev"
  SITE_HOST = "site2037.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/healthz"
    interval = "20s"
    timeout = "8s"
    # n8n cold start + alembic on boot
    grace_period = "180s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024"

[[mounts]]
  source = "app_data"
  destination = "/data"
