# VM 2 — Evolution only (reusa app evolution2037)
app = "evolution2037"
primary_region = "iad"

[build]
  image = "evoapicloud/evolution-api:v2.3.7"

[env]
  SERVER_TYPE = "http"
  SERVER_PORT = "8080"
  SERVER_URL = "https://evolution2037.fly.dev"
  # CONFIG_SESSION_PHONE_VERSION removida de proposito: versao fixa envelhece e
  # o WhatsApp recusa o handshake / derruba os vinculados. Sem a env, o Baileys
  # usa a versao embutida na lib (acompanha a imagem). Fixar so em emergencia.
  DATABASE_ENABLED = "true"
  DATABASE_PROVIDER = "postgresql"
  DATABASE_CONNECTION_CLIENT_NAME = "evolution2037"
  DATABASE_SAVE_DATA_INSTANCE = "true"
  DATABASE_SAVE_DATA_NEW_MESSAGE = "true"
  DATABASE_SAVE_MESSAGE_UPDATE = "true"
  DATABASE_SAVE_DATA_CONTACTS = "true"
  DATABASE_SAVE_DATA_CHATS = "true"
  CACHE_REDIS_ENABLED = "true"
  CACHE_REDIS_PREFIX_KEY = "evolution2037"
  CACHE_REDIS_SAVE_INSTANCES = "true"
  CACHE_LOCAL_ENABLED = "false"
  DEL_INSTANCE = "false"
  TELEMETRY = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/"
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024"

[[mounts]]
  source = "evolution_instances"
  destination = "/evolution/instances"
