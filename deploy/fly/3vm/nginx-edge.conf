# Edge :8080 no app2037
# - Portal: default /
# - Chatbot API: /webhook /v1 /health (para n8n via flycast ou HTTPS)
# - Estoque mídia: /public/
# - Site: /site/
# - Catálogo: Host catalogo2037 OU path /loja/

map $host $backend {
    default                         http://127.0.0.1:9000;
    portal2037.fly.dev              http://127.0.0.1:9000;
    catalogo2037.fly.dev            http://127.0.0.1:8003;
    site2037.fly.dev                http://127.0.0.1:8081;
    app2037.fly.dev                 http://127.0.0.1:9000;
}

server {
    # Fly private network / flycast is IPv6-only — must listen on [::]
    listen 8080;
    listen [::]:8080;
    server_name _;
    client_max_body_size 25m;
    # Evita Location: http://host:8080/... em redirects (browser “off”)
    absolute_redirect off;
    port_in_redirect off;

    location = /healthz {
        proxy_pass http://127.0.0.1:8099/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Chatbot API (n8n → http://app2037.flycast:8080/...)
    location ^~ /webhook/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location ^~ /health/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Mídia estoque
    location ^~ /public/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Site marketing em path (sem precisar de cert extra)
    location ^~ /site/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Catálogo em path
    location ^~ /loja/ {
        proxy_pass http://127.0.0.1:8003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Revy Tráfego (equipe) — strip /trafego → app :9010
    location = /trafego {
        return 302 /trafego/;
    }
    location ^~ /trafego/ {
        proxy_pass http://127.0.0.1:9010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Fly termina TLS: force https no app (cookies Secure)
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        # App já emite Location com REVY_TRAFEGO_URL_PREFIX=/trafego — não reescrever
        proxy_redirect off;
    }

    location / {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
