services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: crm
    volumes:
      - crm_pg:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  estoque-api:
    build: ../../estoque-api
    environment:
      - DATABASE_URL=postgresql+psycopg://crm:${POSTGRES_PASSWORD:-crm}@postgres:5432/estoque
      - ESTOQUE_SKIP_INIT=1
      - ESTOQUE_OUTBOX_KEY=${ESTOQUE_OUTBOX_KEY:-}
      - ESTOQUE_MEDIA_PUBLIC_BASE_URL=${ESTOQUE_MEDIA_PUBLIC_BASE_URL:-}
      - ESTOQUE_MEDIA_STORAGE_DIR=/data/media
      - ESTOQUE_MEDIA_MAX_FOTOS=${ESTOQUE_MEDIA_MAX_FOTOS:-20}
      - ESTOQUE_MEDIA_MAX_BYTES=${ESTOQUE_MEDIA_MAX_BYTES:-10485760}
      - ESTOQUE_MEDIA_URL_MAX_CHARS=${ESTOQUE_MEDIA_URL_MAX_CHARS:-2048}
      - ESTOQUE_MEDIA_ALLOWED_HOSTS=${ESTOQUE_MEDIA_ALLOWED_HOSTS:-}
    ports:
      - "8100:8000"
    volumes:
      - estoque_media:/data/media
    depends_on:
      postgres:
        condition: service_healthy

  # Worker da outbox do Estoque (entrega vehicle.* via webhook assinado com HMAC + retry).
  estoque-outbox:
    build: ../../estoque-api
    command: ["python", "-m", "app.worker"]
    environment:
      - DATABASE_URL=postgresql+psycopg://crm:${POSTGRES_PASSWORD:-crm}@postgres:5432/estoque
      - ESTOQUE_OUTBOX_KEY=${ESTOQUE_OUTBOX_KEY:-}
      - ESTOQUE_OUTBOX_INTERVALO=${ESTOQUE_OUTBOX_INTERVALO:-5}
    depends_on:
      postgres:
        condition: service_healthy
      estoque-api:
        condition: service_started
    restart: unless-stopped

  chatbot-api:
    build: ../../chatbot-api
    environment:
      - DATABASE_URL=postgresql+psycopg://crm:${POSTGRES_PASSWORD:-crm}@postgres:5432/chatbot
      - CHATBOT_SKIP_INIT=1
      - CHATBOT_WEBHOOK_TOKEN=${CHATBOT_WEBHOOK_TOKEN:?defina CHATBOT_WEBHOOK_TOKEN no .env}
      - CHATBOT_WEBHOOK_MAX_PAYLOAD_BYTES=${CHATBOT_WEBHOOK_MAX_PAYLOAD_BYTES:-32768}
      - CHATBOT_WEBHOOK_MAX_TEXT_CHARS=${CHATBOT_WEBHOOK_MAX_TEXT_CHARS:-4096}
      - CHATBOT_WEBHOOK_MAX_INSTANCE_CHARS=${CHATBOT_WEBHOOK_MAX_INSTANCE_CHARS:-120}
      - CHATBOT_WEBHOOK_MAX_PROVIDER_MESSAGE_ID_CHARS=${CHATBOT_WEBHOOK_MAX_PROVIDER_MESSAGE_ID_CHARS:-255}
      - CHATBOT_WEBHOOK_MAX_EVENT_TYPE_CHARS=${CHATBOT_WEBHOOK_MAX_EVENT_TYPE_CHARS:-64}
      - CHATBOT_WEBHOOK_RATE_LIMIT_REQUESTS=${CHATBOT_WEBHOOK_RATE_LIMIT_REQUESTS:-600}
      - CHATBOT_WEBHOOK_RATE_LIMIT_WINDOW_SECONDS=${CHATBOT_WEBHOOK_RATE_LIMIT_WINDOW_SECONDS:-60}
      - CHATBOT_WEBHOOK_RATE_LIMIT_MAX_BUCKETS=${CHATBOT_WEBHOOK_RATE_LIMIT_MAX_BUCKETS:-10000}
      - CHATBOT_AUDIO_EVOLUTION_URL=${CHATBOT_AUDIO_EVOLUTION_URL:-http://evolution:8080}
      - CHATBOT_AUDIO_EVOLUTION_API_KEY=${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      - CHATBOT_AUDIO_TRANSCRIPTION_PROVIDER=${CHATBOT_AUDIO_TRANSCRIPTION_PROVIDER:-none}
      - CHATBOT_AUDIO_TRANSCRIPTION_URL=${CHATBOT_AUDIO_TRANSCRIPTION_URL:-}
      - CHATBOT_AUDIO_TRANSCRIPTION_TOKEN=${CHATBOT_AUDIO_TRANSCRIPTION_TOKEN:-}
      - CHATBOT_AUDIO_MAX_BYTES=${CHATBOT_AUDIO_MAX_BYTES:-8388608}
      - CHATBOT_AUDIO_MAX_DURATION_SECONDS=${CHATBOT_AUDIO_MAX_DURATION_SECONDS:-180}
      - CHATBOT_AUDIO_DOWNLOAD_TIMEOUT=${CHATBOT_AUDIO_DOWNLOAD_TIMEOUT:-10}
      - CHATBOT_AUDIO_TRANSCRIPTION_TIMEOUT=${CHATBOT_AUDIO_TRANSCRIPTION_TIMEOUT:-15}
      - CHATBOT_IMAGE_EVOLUTION_URL=${CHATBOT_IMAGE_EVOLUTION_URL:-http://evolution:8080}
      - CHATBOT_IMAGE_EVOLUTION_API_KEY=${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      - CHATBOT_IMAGE_MAX_BYTES=${CHATBOT_IMAGE_MAX_BYTES:-10485760}
      - CHATBOT_IMAGE_DOWNLOAD_TIMEOUT=${CHATBOT_IMAGE_DOWNLOAD_TIMEOUT:-10}
      - ESTOQUE_PUBLIC_URL=http://estoque-api:8000
      # Escrita no Estoque (E5 cadastro via WhatsApp) — use o TOKEN da loja no estoque-api
      - ESTOQUE_API_URL=${ESTOQUE_API_URL:-http://estoque-api:8000}
      - ESTOQUE_API_TOKEN=${ESTOQUE_API_TOKEN:-}
      - ESTOQUE_REQUEST_TIMEOUT=${ESTOQUE_REQUEST_TIMEOUT:-8}
      - ESTOQUE_MEDIA_ALLOWED_HOSTS=${ESTOQUE_MEDIA_ALLOWED_HOSTS:-}
      - SIMULATION_PROVIDER=${SIMULATION_PROVIDER:-mock}
      - MOTOR_URL=${MOTOR_URL:-}
      - MOTOR_TOKEN=${MOTOR_TOKEN:-}
      - MOTOR_REQUEST_TIMEOUT=${MOTOR_REQUEST_TIMEOUT:-5}
      - MOTOR_POLL_TIMEOUT=${MOTOR_POLL_TIMEOUT:-20}
      - MOTOR_POLL_INTERVAL=${MOTOR_POLL_INTERVAL:-0.5}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  evolution:
    image: evoapicloud/evolution-api:latest
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - CONFIG_SESSION_PHONE_VERSION=${CONFIG_SESSION_PHONE_VERSION:-2.3000.1033773198}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://crm:${POSTGRES_PASSWORD:-crm}@postgres:5432/evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_LOCAL_ENABLED=false
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  n8n:
    image: docker.n8n.io/n8nio/n8n
    environment:
      - N8N_SECURE_COOKIE=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-troque-esta-chave}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - chatbot-api

volumes:
  crm_pg:
  estoque_media:
  evolution_instances:
  n8n_data:
