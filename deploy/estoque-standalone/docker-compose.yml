services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estoque}
      POSTGRES_DB: estoque
    volumes:
      - estoque_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque -d estoque"]
      interval: 5s
      timeout: 3s
      retries: 10

  estoque-api:
    build: ../../estoque-api
    environment:
      - DATABASE_URL=postgresql+psycopg://estoque:${POSTGRES_PASSWORD:-estoque}@postgres:5432/estoque
      - ESTOQUE_SKIP_INIT=1
    ports:
      - "8100:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  estoque_pg:
