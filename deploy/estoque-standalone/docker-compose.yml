services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estoque}
      POSTGRES_DB: estoque
    volumes:
      - estoque_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque -d estoque"]
      interval: 5s
      timeout: 3s
      retries: 10

  estoque-api:
    build: ../../estoque-api
    environment:
      - DATABASE_URL=postgresql+psycopg://estoque:${POSTGRES_PASSWORD:-estoque}@postgres:5432/estoque
      - ESTOQUE_SKIP_INIT=1
      - ESTOQUE_PUBLIC_RATE_LIMIT=${ESTOQUE_PUBLIC_RATE_LIMIT:-120}
      - ESTOQUE_OUTBOX_KEY=${ESTOQUE_OUTBOX_KEY:-}
      - ESTOQUE_MEDIA_PUBLIC_BASE_URL=${ESTOQUE_MEDIA_PUBLIC_BASE_URL:-}
      - ESTOQUE_MEDIA_STORAGE_DIR=/data/media
      - ESTOQUE_MEDIA_MAX_FOTOS=${ESTOQUE_MEDIA_MAX_FOTOS:-20}
      - ESTOQUE_MEDIA_MAX_BYTES=${ESTOQUE_MEDIA_MAX_BYTES:-10485760}
      - ESTOQUE_MEDIA_URL_MAX_CHARS=${ESTOQUE_MEDIA_URL_MAX_CHARS:-2048}
      - ESTOQUE_MEDIA_ALLOWED_HOSTS=${ESTOQUE_MEDIA_ALLOWED_HOSTS:-}
    ports:
      - "8100:8000"
    volumes:
      - estoque_media:/data/media
    depends_on:
      postgres:
        condition: service_healthy

  # Worker da outbox: entrega os eventos (vehicle.*) ao webhook de cada loja com
  # assinatura HMAC e retry. Precisa de ESTOQUE_OUTBOX_KEY quando houver destino configurado.
  estoque-outbox:
    build: ../../estoque-api
    command: ["python", "-m", "app.worker"]
    environment:
      - DATABASE_URL=postgresql+psycopg://estoque:${POSTGRES_PASSWORD:-estoque}@postgres:5432/estoque
      - ESTOQUE_OUTBOX_KEY=${ESTOQUE_OUTBOX_KEY:-}
      - ESTOQUE_OUTBOX_INTERVALO=${ESTOQUE_OUTBOX_INTERVALO:-5}
    depends_on:
      postgres:
        condition: service_healthy
      estoque-api:
        condition: service_started
    restart: unless-stopped

volumes:
  estoque_pg:
  estoque_media:
