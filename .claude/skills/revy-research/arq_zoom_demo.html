<!doctype html>
<meta charset="utf-8">
<title>zoom — demo</title>
<style>
  html,body{margin:0;height:100%;background:#f9f9f9;
    font-family:system-ui,-apple-system,sans-serif;color:#1b1b1b}
  svg{width:100vw;height:100vh;display:block;cursor:grab;touch-action:none}
  #trilha{position:fixed;top:12px;left:12px;background:#fff;padding:6px 12px;
    border:1px solid #ded8d9;border-radius:6px;font-size:13px}
  #dica{position:fixed;bottom:12px;left:12px;background:#fff;padding:8px 12px;
    border:1px solid #ded8d9;border-radius:6px;font-size:11px;color:#57514f}
  [data-k-min],[data-face-ate]{transition:opacity .1s linear}
</style>
<div id="trilha">Revy</div>
<div id="dica">clique numa caixa para cair dentro · <b>Esc</b> volta · roda dá zoom</div>

<svg id="mapa" viewBox="0 0 1200 700">

  <!-- ================= NIVEL 1: o projeto todo ================= -->
  <g id="chatbot" data-navegavel data-titulo="Chatbot API">
    <rect x="60" y="90" width="420" height="300" rx="6" fill="#fff" stroke="#1f4d3a" stroke-width="2"/>
    <!-- FACE: some quando voce entra -->
    <g data-face-ate="1.5">
      <text x="90" y="150" font-size="30" font-weight="600">Chatbot API</text>
      <text x="90" y="185" font-size="15" fill="#57514f">canais · leads · conversas</text>
      <text x="90" y="345" font-size="13" fill="#6b625f">3 canais · 2 workers</text>
    </g>
    <!-- INTERIOR: aparece quando voce entra. Outro diagrama, nao a mesma coisa maior. -->
    <g data-k-min="1.5">
      <text x="78" y="112" font-size="7" font-weight="600">Chatbot API — dentro</text>

      <rect x="78" y="122" width="72" height="34" rx="2" fill="#efeceb" stroke="#cdc6c4" stroke-width=".5"/>
      <text x="84" y="134" font-size="6">Evolution</text>
      <text x="84" y="143" font-size="4.5" fill="#57514f">baileys · QR</text>

      <rect x="78" y="172" width="72" height="34" rx="2" fill="#efeceb" stroke="#cdc6c4" stroke-width=".5"/>
      <text x="84" y="184" font-size="6">n8n</text>
      <text x="84" y="193" font-size="4.5" fill="#57514f">roteia · IA</text>

      <!-- os multiplos WhatsApp -->
      <g id="canal1" data-navegavel data-titulo="Canal WhatsApp · loja A">
        <rect x="190" y="118" width="104" height="42" rx="2" fill="#fff" stroke="#1f4d3a" stroke-width=".8"/>
        <g data-face-ate="5.5">
          <text x="196" y="132" font-size="6.5">WhatsApp · loja A</text>
          <text x="196" y="142" font-size="4.5" fill="#57514f">instância dedicada</text>
        </g>
        <g data-k-min="5.5">
          <text x="193" y="126" font-size="2.4" font-weight="600">Canal · loja A</text>
          <rect x="193" y="129" width="46" height="12" fill="#efeceb" stroke="#cdc6c4" stroke-width=".15"/>
          <text x="195" y="134" font-size="2">instancia</text>
          <text x="195" y="138" font-size="1.6" fill="#57514f">evolution/instance</text>
          <rect x="245" y="129" width="46" height="12" fill="#efeceb" stroke="#cdc6c4" stroke-width=".15"/>
          <text x="247" y="134" font-size="2">webhook</text>
          <text x="247" y="138" font-size="1.6" fill="#57514f">/webhook/mensagem</text>
          <rect x="193" y="144" width="46" height="12" fill="#efeceb" stroke="#cdc6c4" stroke-width=".15"/>
          <text x="195" y="149" font-size="2">fila outbound</text>
          <text x="195" y="153" font-size="1.6" fill="#57514f">teto 250/dia</text>
          <rect x="245" y="144" width="46" height="12" fill="#efeceb" stroke="#cdc6c4" stroke-width=".15"/>
          <text x="247" y="149" font-size="2">anti-ban</text>
          <text x="247" y="153" font-size="1.6" fill="#57514f">typing + throttle</text>
        </g>
      </g>

      <g id="canal2" data-navegavel data-titulo="Canal WhatsApp · loja B">
        <rect x="190" y="168" width="104" height="42" rx="2" fill="#fff" stroke="#1f4d3a" stroke-width=".8"/>
        <g data-face-ate="5.5">
          <text x="196" y="182" font-size="6.5">WhatsApp · loja B</text>
          <text x="196" y="192" font-size="4.5" fill="#57514f">instância dedicada</text>
        </g>
        <g data-k-min="5.5">
          <text x="193" y="176" font-size="2.4" font-weight="600">Canal · loja B</text>
          <rect x="193" y="179" width="46" height="12" fill="#efeceb" stroke="#cdc6c4" stroke-width=".15"/>
          <text x="195" y="184" font-size="2">instancia</text>
          <rect x="245" y="179" width="46" height="12" fill="#efeceb" stroke="#cdc6c4" stroke-width=".15"/>
          <text x="247" y="184" font-size="2">webhook</text>
          <rect x="193" y="194" width="98" height="12" fill="#efeceb" stroke="#cdc6c4" stroke-width=".15"/>
          <text x="195" y="199" font-size="2">mesma topologia da loja A</text>
        </g>
      </g>

      <rect x="190" y="218" width="104" height="30" rx="2" fill="#fff" stroke="#cdc6c4" stroke-width=".5"/>
      <text x="196" y="230" font-size="6">WhatsApp Cloud</text>
      <text x="196" y="240" font-size="4.5" fill="#57514f">meta oficial</text>

      <rect x="330" y="150" width="80" height="34" rx="2" fill="#efeceb" stroke="#cdc6c4" stroke-width=".5"/>
      <text x="336" y="162" font-size="6">Conversa</text>
      <text x="336" y="171" font-size="4.5" fill="#57514f">lead · mensagens</text>

      <rect x="330" y="200" width="80" height="34" rx="2" fill="#efeceb" stroke="#cdc6c4" stroke-width=".5"/>
      <text x="336" y="212" font-size="6">FollowupWorker</text>
      <text x="336" y="221" font-size="4.5" fill="#57514f">followup_job.py:64</text>

      <g stroke="#1f4d3a" stroke-width=".6" fill="none">
        <line x1="150" y1="139" x2="188" y2="139"/>
        <line x1="150" y1="189" x2="188" y2="189"/>
        <line x1="294" y1="139" x2="328" y2="163"/>
        <line x1="294" y1="189" x2="328" y2="170"/>
        <line x1="370" y1="184" x2="370" y2="198" stroke-dasharray="2 2"/>
      </g>
    </g>
  </g>

  <g id="motor" data-navegavel data-titulo="Motor de Simulação">
    <rect x="520" y="90" width="300" height="300" rx="6" fill="#fff" stroke="#1f4d3a" stroke-width="3"/>
    <g data-face-ate="2.1">
      <text x="550" y="150" font-size="26" font-weight="600">Motor</text>
      <text x="550" y="182" font-size="14" fill="#57514f">simulação bancária</text>
      <text x="550" y="345" font-size="13" fill="#b4462f">SPOF · sem retry</text>
    </g>
    <g data-k-min="2.1">
      <text x="534" y="110" font-size="6" font-weight="600">Motor — dentro</text>
      <rect x="534" y="120" width="86" height="30" rx="2" fill="#efeceb" stroke="#cdc6c4" stroke-width=".4"/>
      <text x="540" y="132" font-size="5.5">POST /v1/simulacoes</text>
      <text x="540" y="141" font-size="4" fill="#57514f">síncrono</text>
      <rect x="534" y="160" width="86" height="30" rx="2" fill="#efeceb" stroke="#cdc6c4" stroke-width=".4"/>
      <text x="540" y="172" font-size="5.5">orquestrador</text>
      <text x="540" y="181" font-size="4" fill="#57514f">fila por banco</text>
      <rect x="650" y="120" width="140" height="70" rx="2" fill="#fff" stroke="#b4462f" stroke-width=".8"/>
      <text x="656" y="132" font-size="5.5">driver Playwright</text>
      <text x="656" y="142" font-size="4" fill="#57514f">single-flight — um por vez</text>
      <text x="656" y="152" font-size="4" fill="#b4462f">engole o clique que falha</text>
      <text x="656" y="166" font-size="4" fill="#57514f">credenciais bancárias vivem só aqui</text>
    </g>
  </g>

  <g id="estoque" data-navegavel data-titulo="Estoque API">
    <rect x="60" y="430" width="360" height="200" rx="6" fill="#fff" stroke="#1f4d3a" stroke-width="2"/>
    <g data-face-ate="2.6">
      <text x="90" y="490" font-size="26" font-weight="600">Estoque API</text>
      <text x="90" y="520" font-size="14" fill="#57514f">veículos · fotos</text>
    </g>
    <g data-k-min="2.6">
      <text x="74" y="448" font-size="5" font-weight="600">Estoque — dentro</text>
      <rect x="74" y="456" width="70" height="26" rx="2" fill="#efeceb" stroke="#cdc6c4" stroke-width=".3"/>
      <text x="79" y="467" font-size="4.5">Veiculo</text>
      <rect x="154" y="456" width="70" height="26" rx="2" fill="#efeceb" stroke="#cdc6c4" stroke-width=".3"/>
      <text x="159" y="467" font-size="4.5">Foto</text>
      <rect x="74" y="492" width="150" height="26" rx="2" fill="#efeceb" stroke="#cdc6c4" stroke-width=".3"/>
      <text x="79" y="503" font-size="4.5">GET /v1/veiculos/{id}</text>
    </g>
  </g>

  <g stroke="#1f4d3a" stroke-width="1.5" fill="none">
    <line x1="482" y1="240" x2="518" y2="240"/>
    <line x1="240" y1="392" x2="240" y2="428" stroke-dasharray="6 4"/>
  </g>
</svg>

<script src="arq_zoom.js"></script>
<script>
  var svg = document.getElementById("mapa");
  svg.addEventListener("zoom:mudou", function (ev) {
    document.getElementById("trilha").textContent = ev.detail.titulo || "Revy";
  });
  Zoom.init(svg, {});
</script>
