# O site nao e Fly. Publica no Cloudflare Pages, upload direto da pasta site/.
#
# `--branch=main` nao e opcional: sem ele o wrangler usa a branch git da vez, o
# deploy vira um preview silencioso e o dominio fica na versao anterior sem
# ninguem reclamar. No CI a branch git seria "main" de qualquer jeito, mas o
# flag fica explicito porque o modo de falha e mudo.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publicar:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # `wrangler pages deploy` nao respeita .assetsignore: tudo que esta na
      # pasta vai ao ar. Entao confere antes, e nao depois.
      - name: nada de sensivel dentro de site/
        run: |
          set -euo pipefail
          SUJO=$(find site -type f \( -name '.env*' -o -name '*.key' -o -name '*.pem' -o -name '.token*' -o -name '*.ready.json' \) \
            -not -name '*.example' -not -name '*.exemplo' || true)
          if [ -n "$SUJO" ]; then
            echo "::error::arquivo sensivel dentro de site/ — ele iria ao ar publicamente:"
            echo "$SUJO"
            exit 1
          fi
          echo "site/ limpo ($(find site -type f | wc -l) arquivos)"

      - name: wrangler pages deploy
        run: npx --yes wrangler@3 pages deploy site --project-name=revyapp --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: smoke no dominio
        run: |
          set -uo pipefail
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://revyapp.com.br/ || echo 000)
            echo "tentativa $i: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::revyapp.com.br nao respondeu 200 depois do deploy"
          exit 1

      - name: resumo
        if: always()
        run: |
          {
            echo "### site"
            echo ""
            echo "- <https://revyapp.com.br>"
            echo "- commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
