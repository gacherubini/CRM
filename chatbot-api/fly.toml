app = "chatbot2037"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "alembic upgrade head"

[env]
  CHATBOT_SKIP_INIT = "1"
  SIMULATION_PROVIDER = "http"
  MOTOR_URL = "http://motor2037.flycast:8000"
  ESTOQUE_API_URL = "http://estoque2037.flycast:8000"
  ESTOQUE_PUBLIC_URL = "http://estoque2037.flycast:8000"
  MOTOR_REQUEST_TIMEOUT = "8"
  MOTOR_POLL_TIMEOUT = "90"
  MOTOR_POLL_INTERVAL = "1"
  ESTOQUE_REQUEST_TIMEOUT = "8"

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000"

# Always-on: n8n e Portal chamam o Chatbot; cold-start quebra o bot (opção A).
[[services]]
  processes = ["app"]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8000
    handlers = ["http"]

  [[services.http_checks]]
    path = "/health/ready"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  processes = ["app"]
  size = "shared-cpu-1x"
  memory = "512"
