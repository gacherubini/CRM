<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Veículos disponíveis para compra">
  <title>{% block title %}Catálogo de veículos{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/catalog.css') }}">
  {% if meta_pixel_enabled and meta_pixel_id %}
  <!-- Meta Pixel (E10). Pixel ID é público; token CAPI nunca no catálogo. -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '{{ meta_pixel_id }}');
    fbq('track', 'PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id={{ meta_pixel_id }}&ev=PageView&noscript=1"
    alt=""></noscript>
  {% endif %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% if loja %}/l/{{ loja.slug }}{% else %}/{% endif %}">
      <span class="brand-mark">M</span>
      <span>{% if loja %}{{ loja.nome }}{% else %}Catálogo{% endif %}</span>
    </a>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
  <footer class="footer">Estoque atualizado pela loja.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
