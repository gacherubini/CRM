app = "catalogo2037"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  ESTOQUE_PUBLIC_API_URL = "http://estoque2037.flycast:8000"
  CATALOGO_DATABASE_PATH = "/data/catalogo.db"
  CATALOGO_PUBLIC_BASE_URL = "https://catalogo2037.fly.dev"
  CATALOGO_DEFAULT_STORE_SLUG = "moto-center"
  CATALOGO_SECURE_COOKIE = "1"
  CATALOGO_PAGE_SIZE = "12"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/health/ready"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512"

[[mounts]]
  source = "catalogo_data"
  destination = "/data"
