services:
  portal:
    build: .
    environment:
      PORTAL_DATABASE_URL: sqlite:////data/portal.db
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET:-troque-esta-chave-em-producao}
      PORTAL_IDENTITY_HMAC_SECRET: ${PORTAL_IDENTITY_HMAC_SECRET:-}
      PORTAL_SECURE_COOKIE: ${PORTAL_SECURE_COOKIE:-0}
      ESTOQUE_API_URL: ${ESTOQUE_API_URL:-http://host.docker.internal:8100}
      ESTOQUE_API_TOKEN: ${ESTOQUE_API_TOKEN:-}
      CHATBOT_API_URL: ${CHATBOT_API_URL:-http://host.docker.internal:8001}
      CHATBOT_API_TOKEN: ${CHATBOT_API_TOKEN:-}
      MOTOR_URL: ${MOTOR_URL:-http://host.docker.internal:8000}
      MOTOR_TOKEN: ${MOTOR_TOKEN:-}
    ports:
      - "9000:9000"
    volumes:
      - portal_data:/data

volumes:
  portal_data:
